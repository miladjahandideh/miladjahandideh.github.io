<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milad Jahandideh – CV</title>
    <meta name="robots" content="noindex">
    <style>
        @page {
            margin: 1in;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 11pt;
            line-height: 1.5;
            color: #111;
            background: #fff;
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .no-print {
            text-align: center;
            margin-bottom: 24px;
        }

        .no-print button {
            padding: 10px 24px;
            font-size: 14px;
            cursor: pointer;
            background: #0a66c2;
            color: #fff;
            border: none;
            border-radius: 4px;
        }

        .no-print button:hover {
            background: #004182;
        }

        /* Header */
        #cv-header {
            border-bottom: 2px solid #111;
            padding-bottom: 10px;
            margin-bottom: 16px;
        }

        #cv-name {
            font-size: 22pt;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        #cv-title {
            font-size: 13pt;
            margin-top: 2px;
            color: #333;
        }

        #cv-contact {
            margin-top: 6px;
            font-size: 10pt;
            color: #333;
        }

        #cv-contact a {
            color: #111;
            text-decoration: none;
        }

        /* Sections */
        .cv-section {
            margin-bottom: 18px;
        }

        .cv-section-title {
            font-size: 12pt;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #aaa;
            padding-bottom: 2px;
            margin-bottom: 10px;
        }

        /* Experience */
        .exp-item {
            margin-bottom: 14px;
            page-break-inside: avoid;
        }

        .exp-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .exp-role {
            font-weight: bold;
            font-size: 11pt;
        }

        .exp-dates {
            font-size: 10pt;
            color: #444;
            white-space: nowrap;
            margin-left: 8px;
        }

        .exp-company {
            font-size: 10pt;
            color: #333;
            margin-top: 1px;
        }

        .exp-description {
            font-size: 10pt;
            color: #555;
            margin-top: 3px;
            font-style: italic;
        }

        .exp-bullets {
            margin-top: 5px;
            margin-left: 18px;
        }

        .exp-bullets li {
            font-size: 10.5pt;
            margin-bottom: 3px;
            line-height: 1.45;
        }

        /* Education */
        .edu-item {
            margin-bottom: 8px;
        }

        .edu-degree {
            font-weight: bold;
            font-size: 11pt;
        }

        .edu-school {
            font-size: 10pt;
            color: #333;
        }

        /* Skills */
        #cv-skills p {
            font-size: 10.5pt;
            line-height: 1.6;
        }


        @media print {
            .no-print {
                display: none !important;
            }

            body {
                padding: 0;
            }

            a {
                color: #111 !important;
                text-decoration: none !important;
            }
        }
    </style>
</head>
<body>

<div class="no-print">
    <button onclick="window.print()">Print / Save as PDF</button>
</div>

<div id="cv-root">
    <p style="color:#888; font-style:italic;">Loading CV…</p>
</div>

<script>
fetch('cv.json')
    .then(r => r.json())
    .then(render)
    .catch(() => {
        document.getElementById('cv-root').textContent = 'Failed to load cv.json.';
    });

function render(cv) {
    const root = document.getElementById('cv-root');
    root.innerHTML = '';

    // Header
    const contact = [
        cv.contact.email,
        cv.contact.website,
        'github.com/miladjahandideh'
    ].join(' | ');

    root.innerHTML += `
        <div id="cv-header">
            <div id="cv-name">${esc(cv.name)}</div>
            <div id="cv-title">${esc(cv.title)}</div>
            <div id="cv-contact">${esc(contact)}</div>
        </div>
    `;

    // Summary
    if (cv.about_me) {
        root.innerHTML += section('Professional Summary', `<p>${esc(cv.about_me)}</p>`);
    }

    // Experience
    if (cv.experience && cv.experience.length) {
        const items = cv.experience.map(job => {
            const bullets = job.responsibilities
                ? '<ul class="exp-bullets">' + job.responsibilities.map(r => `<li>${esc(r)}</li>`).join('') + '</ul>'
                : '';
            const desc = job.description ? `<div class="exp-description">${esc(job.description)}</div>` : '';
            return `
                <div class="exp-item">
                    <div class="exp-header">
                        <div class="exp-role">${esc(job.position)}</div>
                        <div class="exp-dates">${esc(job.dates)}${job.location ? ' · ' + esc(job.location) : ''}</div>
                    </div>
                    <div class="exp-company">${esc(job.company)}</div>
                    ${desc}
                    ${bullets}
                </div>
            `;
        }).join('');
        root.innerHTML += section('Experience', items);
    }

    // Education
    if (cv.education && cv.education.length) {
        const items = cv.education.map(edu => `
            <div class="edu-item">
                <div class="edu-degree">${esc(edu.degree)}</div>
                <div class="edu-school">${esc(edu.school)}</div>
            </div>
        `).join('');
        root.innerHTML += section('Education', items);
    }

    // Skills
    if (cv.tech_stack && cv.tech_stack.length) {
        root.innerHTML += section('Skills', `<p>${cv.tech_stack.map(esc).join(', ')}</p>`);
    }

}

function section(title, content) {
    return `
        <div class="cv-section">
            <div class="cv-section-title">${esc(title)}</div>
            ${content}
        </div>
    `;
}

function esc(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}
</script>
</body>
</html>
